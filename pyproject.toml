[project]
name = "firmware-stopwatch"
version = "0.3.0"
description = "固件码表：找出固件哪一步慢、为什么、怎么改"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyserial>=3.5",
    "anthropic>=1.13.0",
]

[project.scripts]
fsw = "fsw.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fsw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
